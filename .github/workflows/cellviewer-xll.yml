name: Build Cell Viewer Excel add-in (.xll)

on:
  push:
    paths:
      - 'excel-cellviewer-dna/**'
      - '.github/workflows/cellviewer-xll.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and pack
        working-directory: excel-cellviewer-dna
        run: dotnet build -c Release
      - name: Collect add-ins
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item excel-cellviewer-dna/bin/Release/net462/publish/CellViewer-AddIn64-packed.xll out/CellViewer64.xll
          Copy-Item excel-cellviewer-dna/bin/Release/net462/publish/CellViewer-AddIn-packed.xll   out/CellViewer32.xll
          Copy-Item excel-cellviewer-dna/README.md out/README.md
      - uses: actions/upload-artifact@v4
        with:
          name: CellViewer-xll
          path: out/
