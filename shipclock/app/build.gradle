plugins {
    id "com.android.application"
}

android {
    namespace "com.shiptime.scheduler"
    compileSdk 35

    defaultConfig {
        applicationId "com.shiptime.scheduler"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        // Committed on purpose so every build installs over the previous one.
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
